name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/timeboxing-app-api-integration-1IuJw]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Set to /REPO_NAME/ — GitHub Pages serves under /<repo>/
          VITE_BASE_URL: /vue3_timebox/
          # Production: call APIs directly (no proxy available on static hosting)
          VITE_GITHUB_API_BASE: https://api.github.com
          VITE_GITLAB_API_BASE: https://gitlab.com/api/v4
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
